# Publishes the ARKOS build of this fork to GitHub Container Registry, so
# L'Eina deploys the code in this repository (with its fork changes) and not
# upstream's chatwoot/chatwoot image. See docs/arkos-fork.md.
#
# Tags pushed:
#   ghcr.io/<owner>/chatwoot:sha-<12 chars>  every build
#   ghcr.io/<owner>/chatwoot:develop         pushes to develop
#   ghcr.io/<owner>/chatwoot:<tag>           tags named arkos-v*
name: Publish ARKOS Chatwoot image

on:
  push:
    branches:
      - develop
    tags:
      - arkos-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-arkos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository != 'chatwoot/chatwoot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Image name and tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:sha-${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          elif [ "$GITHUB_REF_NAME" = "develop" ]; then
            tags="${tags},${image}:develop"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
